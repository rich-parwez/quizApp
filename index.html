<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Challenge</title>
    <meta name="description" content="A polished quiz app with configurable categories and question counts.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <div class="app-shell">
        <div class="config-container panel active">
            <div class="panel-header">
                <p class="eyebrow">brain boost</p>
                <h1 class="config-title">Quiz configuration</h1>
            </div>

            <div class="config-option">
                <h2 class="option-title">Select Category</h2>
                <div class="category-options" aria-label="Select quiz category">
                    <button type="button" class="category-option">Programming</button>
                    <button type="button" class="category-option">Geography</button>
                    <button type="button" class="category-option">Mathematics</button>
                    <button type="button" class="category-option active">Entertainment</button>
                </div>
            </div>

            <div class="config-option">
                <h2 class="option-title">Question Count</h2>
                <div class="question-options" aria-label="Select number of questions">
                    <button type="button" class="question-option">5</button>
                    <button type="button" class="question-option active">10</button>
                    <button type="button" class="question-option">15</button>
                    <button type="button" class="question-option">20</button>
                    <button type="button" class="question-option">25</button>
                </div>
            </div>

            <div class="config-summary">
                <span>Ready to play</span>
                <strong class="selected-category-pill">Entertainment</strong>
            </div>

            <button type="button" class="start-quiz-btn">Start Quiz</button>
        </div>

        <div class="quiz-container panel">
            <header class="quiz-header">
                <div class="quiz-brand">
                    <span class="material-symbols-rounded">psychology</span>
                    <h2 class="quiz-title">Quiz Challenge</h2>
                </div>
                <div class="quiz-timer" aria-live="polite">
                    <span class="material-symbols-rounded">timer</span>
                    <p class="time-duration">10s</p>
                </div>
            </header>

            <div class="progress-wrap" aria-label="Quiz progress">
                <div class="progress-meta">
                    <span>Progress</span>
                    <span class="progress-label">0 / 10</span>
                </div>
                <div class="progress-bar">
                    <span class="progress-fill"></span>
                </div>
            </div>

            <div class="quiz-content">
                <p class="question-tag">Question</p>
                <h1 class="question-text">Loading question...</h1>
                <ul class="answer-options"></ul>
            </div>

            <div class="quiz-footer">
                <p class="question-status"><b>0</b> of <b>10</b> Questions</p>
                <button type="button" class="next-question-btn">
                    Next
                    <span class="material-symbols-rounded">arrow_right_alt</span>
                </button>
            </div>
        </div>

        <div class="result-container panel">
            <div class="result-illustration">
                <img src="./image/emoji.png" alt="Quiz result illustration" class="result-img">
            </div>
            <div class="result-badge">Completed</div>
            <h2 class="result-title">Great effort!</h2>
            <p class="result-message"></p>

            <div class="result-stats">
                <div class="stat-card">
                    <span class="stat-label">Score</span>
                    <strong class="score-value">0 / 10</strong>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Grade</span>
                    <strong class="grade-value">Keep going</strong>
                </div>
            </div>

            <div class="result-actions">
                <button type="button" class="secondary-btn back-to-config-btn">Change setup</button>
                <button type="button" class="try-again-btn">Try Again</button>
            </div>
        </div>
    </div>

    <script src="./javascript/questions.js"></script>
    <script src="./javascript/script.js"></script>
</body>

</html>
